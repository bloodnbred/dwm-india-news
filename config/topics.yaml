# TOI headline_category -> coarse topic map.
#
# Source categories are hierarchical and dot separated, e.g. "sports.wwe",
# "business.gadgets", "politics.parliament". This file maps the TOP-LEVEL
# prefix to a coarse topic. Deeper segments are kept in dim_topic_detail for
# drill-down, they do not affect the coarse topic.
#
# Anything not matched falls through to `fallback.topic`. This satisfies the
# Phase 2 gate "every raw category maps to a topic": unmapped categories map to
# a topic, they are never dropped, and the count of fallbacks is reported in
# etl_audit so the map can be extended.

version: 1

# Coarse topics produced by this map. dim_topic rows are created from here.
topics:
  - Politics
  - Business
  - Sports
  - Entertainment
  - Technology
  - World
  - Nation
  - Local
  - Health
  - Education
  - Automobile
  - Travel
  - Food
  - Lifestyle
  - Environment
  - Crime
  - Religion
  - Other
  - Unknown

# Exact top-level prefix -> coarse topic.
prefix_map:
  # --- politics and current affairs ---
  politics: Politics
  "pol.": Politics
  "top-stories": Nation
  nation: Nation
  "nation/": Nation
  india: Nation
  "search": Other
  "lead-stories": Nation
  brief: Nation
  # city.* is ~19% of all rows on its own (mumbai, delhi, chennai, ...).
  # Folding it into Nation would swamp the topic-mix analysis, so local
  # coverage gets its own topic.
  city: Local
  cities: Local
  noida: Local
  delhi: Local
  mumbai: Local
  bengaluru: Local
  hyderabad: Local
  chennai: Local
  kolkata: Local
  pune: Local
  "world/": World
  world: World
  "international": World

  # --- business and markets ---
  business: Business
  business2: Business
  "business/": Business
  economy: Business
  markets: Business
  market: Business
  finance: Business
  "personal-finance": Business
  "companies": Business
  company: Business
  "jobs": Business
  "jobs-and-careers": Business
  "earnings": Business
  "ipo": Business
  "mutual-funds": Business
  "property": Business
  "real-estate": Business

  # --- sport ---
  sports: Sports
  sport: Sports
  cricket: Sports
  football: Sports
  tennis: Sports
  badminton: Sports
  "athletics": Sports
  kabaddi: Sports
  hockey: Sports
  boxing: Sports
  wrestling: Sports
  "sports-wwe": Sports
  "wwe": Sports
  "sports-ipl": Sports
