  "entertainment/": Entertainment
  movies: Entertainment
  movie: Entertainment
  bollywood: Entertainment
  "hollywood": Entertainment
  tv: Entertainment
  "television": Entertainment
  "web-series": Entertainment
  "netflix": Entertainment
  "music": Entertainment
  "celebrity": Entertainment
  "box-office": Entertainment
  "tv-reality-show": Entertainment
  "premium": Entertainment
  "lifestyle/": Lifestyle
  lifestyle: Lifestyle
  "social": Lifestyle
  "sex-and-relationships": Lifestyle

  # --- technology ---
  technology: Technology
  tech: Technology
  "technology/": Technology
  gadgets: Technology
  "gadgets/": Technology
  "telecom": Technology
  "it": Technology
  "internet": Technology
  "software": Technology
  "apps": Technology
  "auto": Automobile
  automobile: Automobile
  "automobile": Automobile
  "cars": Automobile
  "bike": Automobile
  "motors": Automobile
  "auto-lifestyle": Automobile

  # --- health and medicine ---
  health: Health
  "health/": Health
  medicine: Health
  "healthcare": Health
  fitness: Health
  diet: Health
  "wellness": Health
  covid: Health
  "covid-19": Health
