# Applied after prefix_map and before keyword_rules. Order matters: the first
# pattern that matches wins. Needed because TOI has whole families that cannot
# be enumerated, notably the Times city editions (delhi-times, bombay-times,
# lucknow-times, ...), which together are ~46k rows.
prefix_patterns:
  - topic: Local
    match: "-times$"
  - topic: Local
    match: "^city[. ]"
  - topic: Health
    match: "^life-style[.]health"
  - topic: Health
    match: "health|fitness|medical|hospital"
  - topic: Education
    match: "education|school|college|exam|student"
  - topic: Environment
    match: "environment|wildlife|flora|fauna|pollution|climate"
  - topic: Technology
    match: "^home[.]science|tech|gadget|software|internet"
  - topic: Entertainment
    match: "entertainment|movie|bollywood|tv|music|celebrity"
  - topic: Sports
    match: "sport|cricket|football|tennis|olympic"
  - topic: Business
    match: "business|market|economy|finance|stock|ipo|company"
  - topic: Politics
    match: "politic|parliament|election|congress|minister"
  - topic: Automobile
    match: "^auto[. ]|car|bike|vehicle|motor"
  - topic: Travel
    match: "travel|tourism|destination"

# Applied after prefix_patterns. Order matters: first match wins.
keyword_rules:
  - topic: Technology
    match: ["ai", "artificial intelligence", "software", "startup", "app", "chip", "data"]
  - topic: Health
    match: ["virus", "vaccine", "hospital", "covid", "patient", "disease", "outbreak"]
  - topic: Business
    match: ["stock", "market", "rupee", "crore", "ipo", "profit", "gdp", "inflation"]
  - topic: Sports
    match: ["match", "win", "goal", "innings", "tournament", "player", "coach"]
  - topic: Entertainment
    match: ["film", "movie", "actor", "song", "trailer", "box office"]

fallback:
  # Categories that carry no signal. Assigned rather than dropped so the
  # headline still joins to a topic and counts stay reconcilable.
  unknown_labels: ["unknown", "", "n/a", "na", "none", "null", "general", "other"]
  topic: Other

# IFND categories are already coarse (LDA-derived), map straight through.
ifnd_category_map:
  election: Politics
  politics: Politics
  covid-19: Health
  violence: Crime
  miscellaneous: Other
